name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@daveswong'

      # GitHub Packages 的 scope 必须是 GitHub 账号，npmjs 上用的是 @insapp-dev
      - name: 临时改为 @daveswong/inslog
        run: |
          node <<'EOF'
          const fs = require('fs');
          for (const f of ['package.json', 'package-lock.json']) {
            const s = fs.readFileSync(f, 'utf8');
            fs.writeFileSync(f, s.replace(/"name": "@insapp-dev\/inslog"/g, '"name": "@daveswong/inslog"'));
          }
          EOF

      - run: npm ci

      - name: 发布到 GitHub Packages
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 首次发布默认私有，需到包设置 → Danger Zone → Change visibility 手动改 Public
